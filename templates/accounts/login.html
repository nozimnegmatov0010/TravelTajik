<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — TajikTravel</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#F8F6F0] text-stone-800 font-sans antialiased min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-[420px] bg-white border border-stone-200 rounded-3xl shadow-xl p-8">
        
        <div class="text-center mb-6">
            <a href="{% url 'place_list' %}" class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-[#0F3D2E] mb-3 shadow-md hover:bg-[#1B6B4F] transition">
                <svg class="w-8 h-8 text-emerald-300" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="17" cy="7" r="2.5" class="text-amber-300" fill="currentColor" stroke="none"/>
                    <path stroke-linecap="round" stroke-linejoin="round" d="M3 20h18L14 7l-4 6-3-4L3 20z"/>
                </svg>
            </a>
            <h1 class="text-xl font-extrabold text-[#0F3D2E] mb-1">Вход в аккаунт</h1>
            <p class="text-xs text-stone-500">Добро пожаловать в <b>TajikTravel</b></p>
        </div>

        {% if form.errors %}
        <div class="bg-red-50 border border-red-200 text-red-600 py-2.5 px-4 rounded-xl text-xs font-semibold mb-4 text-center">
            Неверный логин или пароль!
        </div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            
            <div class="mb-4">
                <label class="block text-xs font-bold text-stone-600 mb-1.5">Имя пользователя</label>
                <input type="text" name="username" required placeholder="Ваш логин"
                       class="w-full bg-stone-50 border border-stone-300 focus:border-[#1B6B4F] focus:bg-white rounded-xl px-4 py-2.5 text-sm text-stone-800 placeholder-stone-400 outline-none transition">
            </div>

            <div class="mb-6">
                <label class="block text-xs font-bold text-stone-600 mb-1.5">Пароль</label>
                <input type="password" name="password" required placeholder="Ваш пароль"
                       class="w-full bg-stone-50 border border-stone-300 focus:border-[#1B6B4F] focus:bg-white rounded-xl px-4 py-2.5 text-sm text-stone-800 placeholder-stone-400 outline-none transition">
            </div>

            <button type="submit" class="w-full bg-[#0F3D2E] hover:bg-[#1B6B4F] text-white font-semibold py-3 rounded-xl text-sm transition shadow-sm mb-4">
                Войти
            </button>
        </form>

        <div class="text-center">
            <p class="text-xs text-stone-500">
                Ещё нет аккаунта? 
                <a href="{% url 'register' %}" class="text-[#1B6B4F] hover:underline font-bold ml-1">Зарегистрироваться</a>
            </p>
        </div>

    </div>

</body>
</html>
