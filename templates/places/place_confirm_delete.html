{% extends 'base.html' %}

{% block title %}Удаление объекта — TravelTajik{% endblock %}

{% block content %}
<div class="max-w-lg mx-auto bg-white p-8 rounded-3xl shadow-sm border border-stone-200 text-center">
    <h1 class="text-2xl font-extrabold text-stone-900 mb-3">Удалить объект?</h1>
    <p class="text-stone-600 mb-6">
        Вы уверены, что хотите удалить <b>«{{ object.title }}»</b>? Это действие нельзя отменить.
    </p>
    <form method="post" class="flex justify-center gap-4">
        {% csrf_token %}
        <button type="submit" class="bg-red-600 hover:bg-red-700 text-white font-semibold py-2.5 px-6 rounded-xl transition">
            Да, удалить
        </button>
        <a href="{% url 'place_detail' object.pk %}" class="bg-stone-100 hover:bg-stone-200 text-stone-700 font-semibold py-2.5 px-6 rounded-xl transition">
            Отмена
        </a>
    </form>
</div>
{% endblock %}
