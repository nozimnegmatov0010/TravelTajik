<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}TravelTajik — Открой Таджикистан{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Leaflet CSS & JS для интерактивных карт OpenStreetMap -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-[#F8F6F0] text-stone-800 min-h-screen flex flex-col">

    <header class="bg-[#0F3D2E] text-white sticky top-0 z-50 shadow-lg border-b border-emerald-900">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 py-4 flex justify-between items-center">
            <a href="{% url 'place_list' %}" class="flex items-center gap-2.5 group">
                <div class="w-9 h-9 rounded-xl bg-emerald-500/20 border border-emerald-400/30 flex items-center justify-center text-emerald-300 font-extrabold text-lg">
                    ▲
                </div>
                <div>
                    <span class="text-xl font-extrabold tracking-tight block leading-none">TravelTajik</span>
                    <span class="text-[11px] text-emerald-300/80 font-medium tracking-wider uppercase">CityGuide & Tourism</span>
                </div>
            </a>

            <nav class="flex items-center gap-6 text-sm font-medium">
                <a href="{% url 'place_list' %}" class="text-emerald-100 hover:text-white transition">Все места</a>
                <a href="{% url 'region_list' %}" class="text-emerald-100 hover:text-white transition">Регионы и города</a>
                {% if user.is_authenticated %}
                    <a href="{% url 'place_create' %}" class="bg-[#1B6B4F] hover:bg-emerald-600 text-white px-3.5 py-2 rounded-xl transition text-xs font-semibold">
                        + Добавить место
                    </a>
                {% endif %}
            </nav>
        </div>
    </header>

    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 py-8 md:py-10">
        {% block content %}{% endblock %}
    </main>

    <footer class="bg-[#0F3D2E] text-stone-300 py-8 mt-16 border-t border-emerald-900">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 flex flex-col sm:flex-row justify-between items-center gap-4 text-sm">
            <div><span class="font-bold text-white">TravelTajik</span> — Единая цифровая туристическая платформа Таджикистана</div>
            <div class="text-xs text-emerald-400">Django MVT • PostgreSQL • Tailwind CSS • Leaflet OSM</div>
        </div>
    </footer>

</body>
</html>
